<svg xmlns="http://www.w3.org/2000/svg" width="400" height="206" viewBox="0 0 400 206" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">Python 33.2%, TypeScript 22.2%, Jupyter Notebook 11.0%, C++ 7.9%, HTML 5.8%, C 5.6%, Other 14.3%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #818b98; letter-spacing: 0.04em; }
  .secondary { fill: #59636e; }
  .muted { fill: #818b98; }
  .icon { fill: #59636e; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="399" height="205" rx="6" fill="none" stroke="none"/>
<text x="20" y="28" class="col">MOST USED LANGUAGES</text>
<mask id="bar"><rect class="grow" x="20" y="48" width="360" height="10" rx="5" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="20.00" y="48" width="115.63" height="10" fill="#3572A5"/><rect x="137.63" y="48" width="77.08" height="10" fill="#3178c6"/><rect x="216.72" y="48" width="38.15" height="10" fill="#DA5B0B"/><rect x="256.86" y="48" width="27.62" height="10" fill="#f34b7d"/><rect x="286.49" y="48" width="20.23" height="10" fill="#e34c26"/><rect x="308.71" y="48" width="19.40" height="10" fill="#555555"/><rect x="330.11" y="48" width="49.89" height="10" fill="#8c959f"/></g>
<g transform="translate(20 84)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="11" class="label">Python <tspan class="secondary">33.2%</tspan></text></g></g>
<g transform="translate(200 84)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#3178c6"/><text x="16" y="11" class="label">TypeScript <tspan class="secondary">22.2%</tspan></text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#DA5B0B"/><text x="16" y="11" class="label">Jupyter Noteb… <tspan class="secondary">11.0%</tspan></text></g></g>
<g transform="translate(200 116)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#f34b7d"/><text x="16" y="11" class="label">C++ <tspan class="secondary">7.9%</tspan></text></g></g>
<g transform="translate(20 148)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#e34c26"/><text x="16" y="11" class="label">HTML <tspan class="secondary">5.8%</tspan></text></g></g>
<g transform="translate(200 148)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#555555"/><text x="16" y="11" class="label">C <tspan class="secondary">5.6%</tspan></text></g></g>
<g transform="translate(20 180)"><g class="fade" style="animation-delay: 620ms"><circle cx="5" cy="6" r="5" fill="#8c959f"/><text x="16" y="11" class="label">Other <tspan class="secondary">14.3%</tspan></text></g></g>
</svg>
